name: Apply i9 final update

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ github.token }}
      - name: Update i9 business data
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          replacements={
            '"理想 i9":{minDp:69800,rate:3.32}':'"理想 i9":{minDp:59800,rate:3.32}',
            'i9:["full","suixin","5m2","rate199"]':'i9:["full","suixin","rate199"]',
            '{name:"理想 i9",price:409800,insurance:10050,financeProfile:"i9"}':'{name:"理想 i9",price:369800,insurance:10050,financeProfile:"i9"}',
            '"理想 i9":[{id:"i9_dimming_glass",name:"二三排调光玻璃",price:10000},{id:"i9_special_color",name:"特殊颜色",price:10000},{id:"i9_mahe_pack",name:"马赫智驾套装",price:20000},{id:"i9_wheel_22",name:"22寸轮毂",price:10000}]':'"理想 i9":[{id:"i9_dimming_glass",name:"二三排调光玻璃",price:10000},{id:"i9_wheel_22",name:"22寸轮毂",price:10000},{id:"i9_home_theater_audio",name:"Home剧院音响",price:10000},{id:"i9_embodied_intelligence",name:"具身智能套装",price:10000},{id:"i9_floating_table",name:"悬浮组合桌板",price:3500}]',
            '"理想 i9":[{id:"i9_full_payment_discount",name:"全款优惠",price:5000,fullOnly:true}]':'"理想 i9":[]'
          }
          for old,new in replacements.items():
              if old not in s:
                  raise SystemExit('Expected source not found: '+old)
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/apply-i9-final-update.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/apply-i9-final-update.yml
          git commit -m "更新 i9 最终定价、选配及金融方案"
          git push
