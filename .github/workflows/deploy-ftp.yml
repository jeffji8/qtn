name: Apply i9 update and restore FTP deploy

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Update i9 production data
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = [
              ('{name:"理想 i9",price:439800,insurance:10050,financeProfile:"i9"}', '{name:"理想 i9",price:409800,insurance:10050,financeProfile:"i9"}'),
              ('"理想 i9":[{id:"i9_dimming_glass",name:"270°电动调光玻璃",price:10000},{id:"i9_special_color",name:"特殊颜色",price:10000},{id:"i9_hook",name:"电动拖车钩",price:6000},{id:"i9_wheel_22",name:"22寸轮毂",price:10000}]', '"理想 i9":[{id:"i9_dimming_glass",name:"二三排调光玻璃",price:10000},{id:"i9_special_color",name:"特殊颜色",price:10000},{id:"i9_mahe_pack",name:"马赫智驾套装",price:20000},{id:"i9_wheel_22",name:"22寸轮毂",price:10000}]')
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'pattern not found: {old[:60]}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Restore normal FTP workflow and clean temporary workflow
        run: |
          cat > .github/workflows/deploy-ftp.yml <<'YAML'
          name: Deploy website to FTP

          on:
            push:
              branches:
                - main
            workflow_dispatch:

          permissions:
            contents: read

          concurrency:
            group: ftp-deploy
            cancel-in-progress: true

          jobs:
            deploy:
              name: Upload site
              runs-on: ubuntu-latest
              timeout-minutes: 10

              steps:
                - name: Checkout repository
                  uses: actions/checkout@v6

                - name: Upload website files
                  uses: SamKirkland/FTP-Deploy-Action@v4.4.0
                  with:
                    server: ${{ secrets.FTP_SERVER }}
                    username: ${{ secrets.FTP_USERNAME }}
                    password: ${{ secrets.FTP_PASSWORD }}
                    protocol: ftp
                    port: 21
                    server-dir: /wwwroot/
                    exclude: |
                      **/.git*
                      **/.git*/**
                      .github/**
                      README.md
          YAML
          rm -f .github/workflows/update-i9-once.yml

      - name: Commit i9 update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/deploy-ftp.yml .github/workflows/update-i9-once.yml
          git commit -m "更新 i9 指导价与正式选配配置"
          git push
